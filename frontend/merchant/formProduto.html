<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/merchant/formProduto.css">
</head>
<body>
    <!--NavBar -->
    <div class="product-page">
        <header class="top-bar">
            <button class="top-icon-btn" onclick="history.back()">
                <img class="top-icon" src="../assets/icons/back.png" >
            </button>
            
            <h1 class="store-title">Perfumaria Store</h1>

            <button class="top-icon-btn">
                <img class="top-icon" src="../assets/icons/share.png">
            </button>
        </header>

        
        <main class="product-edit">
            <!-- Foto Produto -->
        <section class="list-grid">
            <!-- Dados -->
        </section>


    <section class="form-product-container">
        <form class="product-form" id="product-form">
        <div class="form-group">
            <label for="product-name">Nome do Produto</label>
            <input type="text" id="product-name" name="product-name" required>
        </div>

        <div class="form-group">
            <label for="product-description">Descrição do Produto</label>
            <textarea id="product-description" name="product-description"></textarea>
        </div>

        <div class="form-group">
            <label for="product-price-normal">Preço Normal</label>
            <input type="number" id="product-price-normal" name="product-price-normal" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="product-price-promocional">Preço Promocional</label>
            <input type="number" id="product-price-promocional" name="product-price-promocional" step="0.01">
        </div>

        <div class="form-group">
            <label for="destaqueOption">Destaque</label>
            <select id="destaqueOption" name="destaqueOption" required>
                <option value="false">Não</option>
                <option value="true">Sim</option>
            </select>
        </div>
        <div class="form-group">
            <label for="classificacoes">Classificação</label>
            <select id="classificacoes" name="classificacoes" required>

            </select>
        </div>

        <button type="submit" id="submit-button" class="submit-button"></button>
    </form>
    </section>
        
    </main>
    </div>    
</body>
<script type="module" src="../js/merchant/app.js" defer></script>
</html>
