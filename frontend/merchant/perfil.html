<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/merchant/perfil.css">
</head>
<body>
    <!--NavBar -->
    <div class="product-page">
        <header class="top-bar">
            <button class="top-icon-btn" onclick="history.back()">
                <img class="top-icon" src="../assets/icons/back.png" >
            </button>
            
            <h1 class="store-title"></h1>

            <a class="top-icon-btn share">
                
            </a>
        </header>


    <section class="form-perfil-container">
        <form class="perfil-form" id="perfil-form">
        <div class="form-group">
            <label>Logo</label>
            <div class="image-container">
                <input type="file" id="logo-file" name="image" accept="image/*" hidden>
                <img id="logo_image" class="logo_image" name="logo_image">
                <label class="image-upload-label" for="logo-file">Alterar Imagem</label>
            </div>
        </div>

        <div class="form-group">
            <label>Banner</label>
            <div class="image-container">
                <input type="file" id="banner-file" name="image" accept="image/*" hidden>
                <img id="banner_image" class="banner_image" name="logo_image">
                <label class="image-upload-label" for="banner-file">Alterar Imagem</label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="store-name">Nome da Loja</label>
            <input type="text" id="store-name" name="store-name" required>
        </div>

        <div class="form-group">
            <label for="whatsapp">WhatsApp</label>
            <input type="text" id="whatsapp" name="whatsapp" required>
        </div>


        <button type="submit" id="submit-button" class="submit-button-float">Salvar Alterações</button>
    </form>
    </section>
        
    </main>
    </div>    
</body>
<script type="module" src="../js/merchant/app.js" defer></script>
</html>
