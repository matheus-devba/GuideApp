<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/adm/formCliente.css">
</head>
<body>
    <!--NavBar -->
    <div class="product-page">
        <header class="top-bar">
            <button class="top-icon-btn" onclick="history.back()">
                <img class="top-icon" src="/assets/icons/back.png" >
            </button>
            <h1 class="store-title">Guide</h1>
        </header>
        

    <section class="form-client-container">
        <form class="client-form" id="client-form">
        <div class="form-group">
            <label>Nome da Categoria</label>
            <input type="text" id="nome" name="nome" >
        </div>

        <div class="form-group">
            <label>Nicho</label>
            <select id="nicho">
                <option></option>
                <!-- Fazer um map com os nichos da tabela -->
                <option value="1" id="moda" name="moda">Moda</option> 
                <option value="2" id="cosmeticos" name="cosmeticos">Cosméticos</option>
            </select>
        </div>

        <div class="form-group">
            <label>Icone</label>
            <div class="image-container">
                <input type="file" id="icon-file" name="icon" accept="image/*" hidden>
                <img id="icon_image" class="icon_image" name="icon_image">
                <label class="image-upload-label" for="icon-file">Inserir icone</label>
            </div>
        </div>


        <button type="submit" id="submit-button" class="submit-button">Salvar</button>

        </form>
    </section>
        
    </main>
    </div>    
</body>
<script type="module" src="/js/adm/app.js" defer></script>
</html>
