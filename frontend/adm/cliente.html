<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/merchant/formProduto.css">
</head>
<body>
    <!--NavBar -->
    <div class="product-page">
        <header class="top-bar">
            <button class="top-icon-btn" onclick="history.back()">
                <img class="top-icon" src="/assets/icons/back.png" >
            </button>
            <h1 class="store-title">Guide</h1>
        </header>


        
    <main class="product-edit">
            <!-- Foto Produto -->

        <section class="media-product">
            <!-- Dados -->
        </section>


    <section class="form-product-container">
        <form class="product-form" id="product-form">
        <div class="form-group">
            <label for="product-name">Nome da Loja</label>
            <input type="text" id="product-name" name="product-name" required>
        </div>

        <div class="form-group">
            <label for="product-description">Rota</label>
            <input id="product-description" name="product-description">
        </div>

        <button type="submit" id="submit-button" class="submit-button">Salvar</button>
    </form>
    </section>
        
    </main>
    </div>    
</body>
<script type="module" src="../js/adm/app.js" defer></script>
</html>
