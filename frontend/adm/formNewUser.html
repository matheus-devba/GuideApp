<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/adm/formCliente.css">
</head>
<body>
    <!--NavBar -->
    <div class="product-page">
        <header class="top-bar">
            <button class="top-icon-btn" onclick="history.back()">
                <img class="top-icon" src="/assets/icons/back.png" >
            </button>
            <h1 class="store-title">Guide</h1>
        </header>
        

    <section class="form-usuario-container">
        <form class="usuario-form" id="usuario-form">

    <div class="form-group">
        <label for="loja_id">Selecione a Loja</label>
        <select id="loja_id" name="loja_id">
            <!-- Esta opção serve apenas como um marcador de posição (placeholder) -->
            <option value="" disabled selected>Escolha uma loja...</option>
            
            <!-- Exemplo de como as lojas reais devem ser injetadas dinamicamente:
            <option value="1">Loja Central Matriz</option>
            <option value="2">Filial Zona Sul</option> 
            -->
        </select>
    </div>

        <div class="form-group">
            <label>Nome do Usuario</label>
            <input type="text" id="nome-usuario" name="nome-usuario" >
        </div>

        <div class="form-group">
            <label>E-mail</label>
            <input id="email" name="email">
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input id="senha" name="senha">
        </div>


        <div class="form-group">
            <label>Tipo</label>
            <select id="tipo">
                <option value="user" id="user" name="user">user</option>
                <option value="adm" id="adm" name="adm">adm</option>
            </select>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select id="ativo">
                <option value=true id="true" name="true">Ativo</option>
                <option value=false id="inativo" name="false">Inativo</option>
            </select>
        </div>


        <button type="submit" id="submit-button" class="submit-button">Salvar</button>

        </form>
    </section>
        
    </main>
    </div>    
</body>
<script type="module" src="/js/adm/app.js" defer></script>
</html>
