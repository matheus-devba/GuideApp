<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/adm/formCliente.css">
</head>
<body>
    <!--NavBar -->
    <div class="product-page">
        <header class="top-bar">
            <button class="top-icon-btn" onclick="history.back()">
                <img class="top-icon" src="/assets/icons/back.png" >
            </button>
            <h1 class="store-title">Guide</h1>
        </header>
        

    <section class="form-client-container">
        <form class="client-form" id="client-form">
        <div class="form-group">
            <label>Nome da Loja</label>
            <input type="text" id="store-name" name="store-name" >
        </div>

        <div class="form-group">
            <label>Endereço</label>
            <input id="endereco" name="endereco" >
        </div>

        
        <div class="form-group">
            <label>Telefone</label>
            <input type="tel" id="telefone" name="telefone" >
        </div>

        <div class="form-group">
            <label>Nicho</label>
            <select id="nicho_id">
                <option></option>
                <!-- Fazer um map com os nichos da tabela -->
                <option value="1" id="moda" name="moda">Moda</option> 
                <option value="2" id="cosmeticos" name="cosmeticos">Cosméticos</option>
            </select>
        </div>

        <div class="form-group">
            <label>Logo</label>
            <div class="image-container">
                <input type="file" id="logo-file" name="image" accept="image/*" hidden>
                <img id="logo_image" class="logo_image" name="logo_image">
                <label class="image-upload-label" for="logo-file">Alterar Imagem</label>
            </div>
        </div>

        <div class="form-group">
            <label>Banner</label>
            <div class="image-container">
                <input type="file" id="banner-file" name="image" accept="image/*" hidden>
                <img id="banner_image" class="banner_image" name="logo_image">
                <label class="image-upload-label" for="banner-file">Alterar Imagem</label>
            </div>
        </div>

        <div class="form-group">
            <label>Descrição</label>
            <textarea id="descricao" name="descricao"></textarea>
        </div>

        <div class="form-group">
            <label>WhatsApp</label>
            <input type="tel" id="whatsapp" name="whatsapp">
        </div>

        <div class="form-group">
            <label>Status</label>
            <select id="ativo">
                <option value=true id="true" name="true">Ativo</option>
            </select>
        </div>


        <button type="submit" id="submit-button" class="submit-button">Salvar</button>

        </form>
    </section>
        
    </main>
    </div>    
</body>
<script type="module" src="/js/adm/app.js" defer></script>
</html>
