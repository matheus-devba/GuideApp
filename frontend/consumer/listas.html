<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <!--NavBar -->
    <div class="store-page">
        <header class="top-bar">
            <button class="top-icon-btn" onclick="history.back()">
                <img class="top-icon" src="../assets/icons/back.png" >
            </button>
            <!-- <img class="guide-icon" src="../assets/icons/icone-guide.png" > -->
            <h1 class="store-title">Listas</h1>
        </header>


        <!-- Todos os produtos -->
        <section class="product-list">
            <header class="product-strip-header">
                <h2 class="sections-title">Listas Recomendadas</h2>
            </header>
        </section>

        
        <section class="store-controls">
            <form class="store-search-form" action="" method="GET">
                <input type="search" placeholder="Buscar listas..." name="query" class="search">
                <button type="submit" >Buscar</button>
            </form>
        </section>


        <section class="product-list-all">
         
        </section>
    </div>
</body>
